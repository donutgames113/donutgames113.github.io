<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curato | Your style, remixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --ink: #201b35;
            --muted: #756d89;
            --paper: #f7f4ee;
            --card: #fffdf8;
            --line: #e6e0d7;
            --purple: #7455f5;
            --orange: #ff8a5b;
            --mint: #b9eed9;
            --yellow: #ffe38b;
            --shadow: rgba(54, 38, 84, .07);
            --backdrop: rgba(32, 27, 53, .55);
        }
        body.dark-mode {
            --ink: #f7f3ec;
            --muted: #d0c8d8;
            --paper: #171522;
            --card: #242031;
            --line: #51475f;
            --mint: #3e766b;
            --yellow: #f1cf63;
            --shadow: rgba(0, 0, 0, .28);
            --backdrop: rgba(0, 0, 0, .72);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--paper);
            font-family: "Space Grotesk", sans-serif;
            letter-spacing: -0.015em;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .32;
            background-image: radial-gradient(color-mix(in srgb, var(--muted) 22%, transparent) 0.7px, transparent .7px);
            background-size: 14px 14px;
            z-index: -1;
        }
        .mono { font-family: "DM Mono", monospace; }
        .topbar {
            background: color-mix(in srgb, var(--paper) 88%, transparent);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(16px);
        }
        .brand-mark {
            display: inline-flex;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            color: white;
            background: var(--purple);
            border-radius: 11px 11px 11px 3px;
            transform: rotate(-6deg);
            box-shadow: 4px 4px 0 var(--yellow);
        }
        .surface {
            background: color-mix(in srgb, var(--card) 92%, transparent);
            border: 1px solid var(--line);
            box-shadow: 0 14px 45px var(--shadow);
        }
        .glass { background: var(--card); border: 1px solid var(--line); box-shadow: 0 14px 45px var(--shadow); }
        .eyebrow {
            color: var(--purple);
            font: 500 11px/1 "DM Mono", monospace;
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .hero-title { font-size: clamp(2.7rem, 7vw, 6.5rem); line-height: .93; letter-spacing: -.08em; }
        .hero-title em { color: var(--purple); font-style: normal; }
        .prompt-wrap { background: #201b35; border-radius: 25px; padding: 8px; box-shadow: 10px 12px 0 var(--mint); }
        #occasion-input {
            min-height: 100px;
            color: white;
            font-size: clamp(1.35rem, 3vw, 2.5rem);
            font-weight: 500;
            line-height: 1.05;
            letter-spacing: -.055em;
        }
        #occasion-input::placeholder { color: rgba(255,255,255,.38); }
        .prompt-submit, .primary-button {
            background: var(--orange);
            color: var(--ink);
            font-weight: 700;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }
        .prompt-submit:hover, .primary-button:hover { background: #ff9d75; transform: translateY(-2px); box-shadow: 0 5px 0 rgba(0,0,0,.18); }
        .prompt-submit:disabled, .primary-button:disabled { opacity: .55; transform: none; box-shadow: none; }
        .suggestion-chip, .chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 34px;
            padding: 7px 13px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--card);
            color: var(--ink);
            cursor: pointer;
            font: 500 12px/1.2 "DM Mono", monospace;
            transition: .2s ease;
        }
        .suggestion-chip:hover, .chip:hover, .cat-opt.active, .sort-opt.active {
            color: var(--ink);
            border-color: var(--purple);
            background: color-mix(in srgb, var(--purple) 14%, var(--card));
            transform: translateY(-1px);
        }
        .section-label {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--ink);
            font: 500 12px/1.2 "DM Mono", monospace;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .section-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
        .drop-zone {
            min-height: 230px;
            border: 1.5px dashed #c9c0b5;
            border-radius: 19px;
            background: linear-gradient(135deg, var(--card), color-mix(in srgb, var(--paper) 70%, var(--card)));
            transition: .2s ease;
        }
        .drop-zone:hover { border-color: var(--purple); background: color-mix(in srgb, var(--purple) 12%, var(--card)); }
        .upload-orb { width: 58px; height: 58px; display: grid; place-items: center; color: var(--purple); background: #e9e4ff; border-radius: 18px 18px 18px 5px; font-size: 22px; }
        .field { color: var(--ink); border-bottom: 1px solid var(--line); background: transparent; }
        .field::placeholder { color: var(--muted); opacity: .9; }
        .field:focus { border-color: var(--purple) !important; outline: none; }
        .filter-box { background: color-mix(in srgb, var(--line) 48%, var(--paper)); border-radius: 15px; padding: 5px; }
        .filter-box .chip { border-color: transparent; background: transparent; }
        .filter-box .chip.active { background: var(--card); box-shadow: 0 2px 8px rgba(32,27,53,.08); }
        .item-card { position: relative; cursor: pointer; transition: transform .25s ease; }
        .item-card:hover { transform: translateY(-6px) rotate(-.6deg); }
        .item-card:focus-visible { outline: 3px solid var(--yellow); outline-offset: 5px; }
        .img-container { overflow: hidden; aspect-ratio: 4 / 5; border: 1px solid var(--line); border-radius: 19px; background: var(--card); box-shadow: 5px 6px 0 var(--line); }
        .item-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .45s ease; }
        .item-card:hover img { transform: scale(1.06); }
        .item-details { max-height: 0; overflow: hidden; opacity: 0; margin-top: 0; padding: 0 12px; border: 1px solid transparent; border-radius: 14px; background: color-mix(in srgb, var(--card) 86%, transparent); transition: max-height .3s ease, opacity .2s ease, margin-top .3s ease, padding .3s ease, border-color .3s ease; }
        .item-card[aria-expanded="true"] .item-details { max-height: 300px; opacity: 1; margin-top: 14px; padding: 12px; border-color: var(--line); }
        .item-detail-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); color: var(--muted); font: 500 12px/1.35 "DM Mono", monospace; text-transform: capitalize; }
        .item-detail-row:last-child { border-bottom: 0; }
        .item-detail-row strong { color: var(--ink); font-weight: 500; text-align: right; }
        #catalog-grid .text-\[11px\] { font-size: 13px; color: var(--ink); }
        #catalog-grid .text-\[9px\] { font-size: 12px; color: var(--muted); }
        #item-count { color: var(--purple); font: 500 13px "DM Mono", monospace; }
        .icon-button { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font: 500 12px "DM Mono", monospace; text-transform: uppercase; transition: .2s; }
        .icon-button:hover { color: var(--ink); }
        .ai-render-area { color: var(--ink); text-align: left; line-height: 1.8; }
        .ai-render-area h2 { color: var(--ink); font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 700; line-height: 1.02; letter-spacing: -.06em; margin: 0 0 1.6rem; }
        .ai-render-area h2::before { content: "\f005"; display: inline-grid; place-items: center; width: 34px; height: 34px; margin-right: 10px; color: var(--ink); background: var(--yellow); border-radius: 10px 10px 10px 3px; font: 900 14px "Font Awesome 6 Free"; vertical-align: 8%; }
        .ai-render-area h3 { display: flex; align-items: center; gap: 8px; color: var(--ink); border: 0; font: 500 12px "DM Mono", monospace; letter-spacing: .1em; margin: 2rem 0 .8rem; padding: 0; text-transform: uppercase; }
        .ai-render-area h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
        .ai-render-area ul { display: grid; gap: 9px; margin: 0; padding: 0; }
        .ai-render-area li { margin: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--card) 74%, transparent); font-size: 14px; }
        .ai-render-area li strong { color: var(--ink); display: block; font-size: 15px; }
        .ai-item-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px; margin: 0 0 1.25rem; }
        .ai-item-card { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--card) 82%, transparent); color: inherit; text-align: left; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
        .ai-item-card:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(32,27,53,.08); }
        .ai-item-card:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
        .ai-item-card img { width: 100%; height: 104px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
        .ai-item-card span { display: block; color: var(--muted); font: 500 10px "DM Mono", monospace; text-transform: uppercase; letter-spacing: .08em; }
        .ai-vibe-row, .ai-vibe-pill { display: none !important; }
        .consultation-inspector-item { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
        .consultation-inspector-item img { width: 100%; max-height: 460px; object-fit: cover; border: 1px solid var(--line); border-radius: 18px; }
        .consultation-inspector-details { min-width: 0; }
        @media (max-width: 640px) { .consultation-inspector-item { grid-template-columns: 1fr; } .consultation-inspector-item img { max-height: 340px; } }
        .response-copy { margin: 0 0 1rem; color: var(--ink); font-size: 16px; line-height: 1.8; }
        .response-copy strong { color: var(--ink); font-weight: 700; }
        .ai-render-area blockquote { margin: 1.5rem 0 0; padding: 15px 17px; border: 1px solid color-mix(in srgb, var(--orange) 48%, var(--line)); border-left: 4px solid var(--orange); border-radius: 0 14px 14px 14px; color: var(--muted); background: color-mix(in srgb, var(--orange) 8%, var(--card)); }
        .ai-render-area .text-white, .ai-render-area .text-white\/90, .ai-render-area .text-white\/75, .ai-render-area .text-white\/70, .ai-render-area .text-white\/50 { color: var(--ink); }
        .ai-render-area .text-white\/70, .ai-render-area .text-white\/50 { color: var(--muted); }
        .ai-render-area .border-\[\#d4ff6a\]\/50 { border-color: var(--orange); }
        .favorite-stack { position: relative; height: 210px; overflow: hidden; border: 1px solid var(--line); border-radius: 17px; background: color-mix(in srgb, var(--line) 48%, var(--paper)); }
        .favorite-card { position: absolute; width: 112px; height: 154px; left: 50%; top: 50%; margin: -77px 0 0 -56px; overflow: hidden; border: 4px solid var(--card); border-radius: 10px; box-shadow: 0 12px 24px rgba(54,38,84,.2); transform: translate(var(--x),var(--y)) rotate(var(--r)); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
        .favorite-card img { width: 100%; height: 100%; object-fit: cover; }
        .favorite-stack:hover .favorite-card, .favorite-stack.is-revealed .favorite-card { transform: translate(calc(var(--x) + var(--hover-x)),calc(var(--y) + var(--hover-y))) rotate(var(--hover-r)); }
        .favorite-name { position: absolute; right: 12px; bottom: 10px; left: 12px; color: var(--ink); font: 500 10px "DM Mono", monospace; text-transform: uppercase; }
        .favorite-panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 10px; box-shadow: 0 10px 28px var(--shadow); }
        .favorite-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 0 3px; }
        .favorite-action, .inspector-action { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: transparent; font: 500 10px "DM Mono", monospace; text-transform: uppercase; transition: .2s ease; }
        .favorite-action:hover, .inspector-action:hover { color: var(--ink); border-color: var(--purple); background: color-mix(in srgb, var(--purple) 9%, var(--card)); }
        .favorite-action.danger:hover { color: #c34f55; border-color: #c34f55; background: color-mix(in srgb, #c34f55 8%, var(--card)); }
        .favorite-title { min-width: 0; flex: 1; color: var(--ink); border-bottom: 1px solid var(--line); background: transparent; padding: 8px 2px; font-size: 12px; }
        .favorite-title:focus { border-color: var(--purple); outline: none; }
        .favorite-items { margin-top: 12px; padding: 10px; border-radius: 13px; background: color-mix(in srgb, var(--paper) 65%, var(--card)); }
        .favorite-items li { color: var(--muted); }
        .inspector-item { display: flex; align-items: center; gap: 14px; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
        .inspector-item img { width: 66px; height: 80px; border-radius: 11px; object-fit: cover; border: 1px solid var(--line); }
        .inspector-item-name { color: var(--ink); font-size: 17px; font-weight: 700; line-height: 1.3; }
        .inspector-meta { margin-top: 7px; color: var(--muted); font: 500 12px/1.4 "DM Mono", monospace; letter-spacing: .04em; text-transform: uppercase; }
        button:focus-visible, input:focus-visible, select:focus-visible, [tabindex="0"]:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
        #favorites-modal section, #item-inspector-modal section { background: var(--paper); border-color: var(--line); }
        #favorites-modal .text-white\/80, #favorites-modal .text-white\/70, #favorites-modal .text-white\/65, #favorites-modal .text-white\/40, #favorites-modal .text-white\/30,
        #item-inspector-modal .text-white\/90, #item-inspector-modal .text-white\/40, #item-inspector-modal .text-white\/30 { color: var(--ink); }
        #favorites-modal .text-white\/70, #favorites-modal .text-white\/65, #favorites-modal .text-white\/40, #favorites-modal .text-white\/30,
        #item-inspector-modal .text-white\/40, #item-inspector-modal .text-white\/30 { color: var(--muted); }
        #favorites-modal .border-white\/10, #item-inspector-modal .border-white\/10 { border-color: var(--line); }
        #favorites-modal .bg-white\/\[0\.03\], #item-inspector-modal .bg-white\/\[0\.03\] { background: color-mix(in srgb, var(--card) 82%, transparent); }
        #favorites-modal input { color: var(--ink); border-color: var(--line); font-size: 14px; }
        #favorites-modal input::placeholder { color: var(--muted); }
        .theme-toggle { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 11px; color: var(--muted); transition: .2s ease; }
        .theme-toggle:hover { color: var(--ink); border-color: var(--purple); transform: rotate(-8deg); }
        .dark-mode .fa-sun { display: inline-block; }
        .dark-mode .fa-moon { display: none; }
        body:not(.dark-mode) .theme-toggle .fa-sun { display: none; }
        #favorites-list button, #item-inspector-modal button { min-height: 34px; }
        #item-inspector-modal section, #favorites-modal section { color: var(--ink); }
        #item-inspector-title, #favorites-title { font-size: clamp(1.8rem, 4vw, 2.5rem); line-height: 1.1; }
        #item-inspector-modal .inspector-item, #item-inspector-modal .consultation-inspector-item { font-size: 15px; }
        #item-inspector-modal .item-detail-row { min-height: 38px; }
        @media (max-width: 640px) { .hero-title { font-size: 3.6rem; } .prompt-wrap { box-shadow: 6px 8px 0 var(--mint); } .response-copy { font-size: 15px; } }
    </style>
</head>
<body>
    <nav class="topbar fixed top-0 z-50 w-full">
        <div class="mx-auto flex h-[72px] max-w-7xl items-center justify-between px-5 md:px-8">
            <a href="#" class="flex items-center gap-3 no-underline" aria-label="Curato home">
                <span class="brand-mark"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
                <strong class="text-lg font-bold leading-none tracking-[-.06em]">curato</strong>
            </a>
            <div class="flex items-center gap-4">
                <select id="model-select" class="hidden border-b border-[#dcd4ca] bg-transparent pb-1 text-[10px] text-[#756d89] outline-none md:block">
                    <option value="gemini-3.1-flash-lite-preview">3.1 Flash Lite</option>
                    <option value="gemini-3.1-pro-preview">3.1 Pro</option>
                    <option value="gemini-3-flash-preview">3 Flash Preview</option>
                </select>
                <input id="user-api-key" type="password" placeholder="Gemini key" class="hidden w-24 border-b border-[#dcd4ca] bg-transparent pb-1 text-[10px] outline-none md:block" aria-label="Gemini API key">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"><i class="fa-solid fa-moon"></i><i class="fa-solid fa-sun"></i></button>
                <button id="auth-btn" class="icon-button" type="button"><i class="fa-regular fa-circle-user text-base"></i><span>Connect</span></button>
                <button id="favorites-btn" class="icon-button" type="button"><i class="fa-regular fa-bookmark text-base"></i><span class="hidden sm:inline">Favorites</span></button>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-7xl px-5 pb-24 pt-32 md:px-8">
        <section class="mx-auto mb-24 max-w-5xl">
            <h1 class="hero-title max-w-4xl font-bold">Get dressed<br><em>for the plot.</em></h1>
            <div class="prompt-wrap mt-9">
                <input id="occasion-input" class="w-full border-0 bg-transparent px-5 pb-5 pt-4 outline-none" placeholder="Where are we going?" aria-label="Tell Curato what you need an outfit for">
                <div class="flex flex-col items-stretch justify-between gap-3 px-2 pb-2 sm:flex-row sm:items-center">
                    <div class="flex flex-wrap gap-2">
                        <button onclick="document.getElementById('occasion-input').value = this.innerText" class="suggestion-chip"><i class="fa-solid fa-plane-departure"></i> Tokyo solo trip</button>
                        <button onclick="document.getElementById('occasion-input').value = this.innerText" class="suggestion-chip"><i class="fa-solid fa-sun"></i> Meeting the family</button>
                        <button onclick="document.getElementById('occasion-input').value = this.innerText" class="suggestion-chip"><i class="fa-solid fa-moon"></i> Late night in Soho</button>
                    </div>
                    <button id="ask-btn" class="prompt-submit rounded-[17px] px-5 py-3 text-[11px] uppercase tracking-[.08em]"><i class="fa-solid fa-sparkles mr-2"></i> Consult</button>
                </div>
            </div>
            <div id="ai-suggestion" class="surface hidden mt-10 rounded-[23px] p-6 md:p-10 ai-render-area"></div>
            <button id="save-outfit-btn" class="hidden mt-5 rounded-full border border-[#d8d0c7] px-5 py-3 text-[10px] font-medium uppercase tracking-[.1em] text-[#756d89] transition hover:border-[#7455f5] hover:text-[#201b35]" type="button"><i class="fa-regular fa-bookmark mr-2"></i>Save this look</button>
        </section>

        <div class="grid grid-cols-1 gap-14 lg:grid-cols-12 lg:gap-20">
            <aside class="lg:col-span-4 lg:sticky lg:top-28 lg:h-fit">
                <div class="surface rounded-[25px] p-5 md:p-7">
                    <div class="mb-6 flex items-center justify-between"><span class="section-label">Add a piece</span></div>
                    <div id="drop-zone" class="drop-zone group relative flex cursor-pointer items-center justify-center overflow-hidden">
                        <div class="text-center transition-transform duration-300 group-hover:scale-105">
                            <div class="upload-orb mx-auto"><i class="fa-solid fa-arrow-up-from-bracket"></i></div>
                            <div id="drop-text" class="mt-4 text-sm font-semibold">Drop a photo here</div>
                        </div>
                        <img id="preview-img" class="absolute inset-0 hidden h-full w-full object-cover" alt="Selected item preview">
                        <input id="file-input" type="file" class="hidden" accept="image/*">
                    </div>
                    <div id="category-wrap" class="mt-7">
                        <div class="filter-box flex flex-wrap gap-1">
                            <button class="chip cat-opt active" data-val="Other" data-sub="Top"><i class="fa-solid fa-shirt"></i> Top</button>
                            <button class="chip cat-opt" data-val="Other" data-sub="Bottom"><i class="fa-solid fa-person"></i> Bottom</button>
                            <button class="chip cat-opt" data-val="Shoes"><i class="fa-solid fa-shoe-prints"></i> Shoes</button>
                            <button class="chip cat-opt" data-val="Watch"><i class="fa-regular fa-clock"></i> Watch</button>
                            <button class="chip cat-opt" data-val="Fragrance"><i class="fa-solid fa-spray-can-sparkles"></i> Scent</button>
                            <button class="chip cat-opt" data-val="Other"><i class="fa-solid fa-shapes"></i> Other</button>
                        </div>
                    </div>
                    <div class="mt-7 space-y-1">
                        <input id="item-name" placeholder="What is it called?" class="field w-full py-3 text-sm">
                        <input id="item-brand" placeholder="Brand or designer (optional)" class="field w-full py-3 text-sm">
                    </div>
                    <button id="save-btn" class="primary-button mt-7 w-full rounded-[15px] py-4 text-[11px] uppercase tracking-[.1em]"><i class="fa-solid fa-plus mr-2"></i>Archive piece</button>
                </div>
            </aside>

            <section class="lg:col-span-8">
                <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                    <div><h2 class="text-3xl font-bold tracking-[-.06em]">Your wardrobe, <span class="text-[#7455f5]">your rules.</span></h2></div>
                    <div id="item-count" class="self-start rounded-full bg-[#eeeaff] px-3 py-2">00 ITEMS</div>
                </div>
                <div class="filter-box mb-9 flex flex-wrap gap-1">
                    <button class="chip sort-opt active" data-sort="ALL">Everything</button>
                    <button class="chip sort-opt" data-sort="TOPS">Tops</button>
                    <button class="chip sort-opt" data-sort="BOTTOMS">Bottoms</button>
                    <button class="chip sort-opt" data-sort="Watch">Watches</button>
                    <button class="chip sort-opt" data-sort="Fragrance">Scent</button>
                    <button class="chip sort-opt" data-sort="Shoes">Shoes</button>
                    <button class="chip sort-opt" data-sort="Other">Other</button>
                </div>
                <div id="catalog-grid" class="grid grid-cols-2 gap-x-5 gap-y-10 md:grid-cols-3 md:gap-x-7"></div>
            </section>
        </div>
    </main>

    <div id="favorites-modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-5" role="dialog" aria-modal="true" aria-labelledby="favorites-title">
        <div class="absolute inset-0 backdrop-blur-sm" style="background: var(--backdrop)" data-close-favorites></div>
        <section class="relative max-h-[85vh] w-full max-w-4xl overflow-y-auto rounded-[25px] border p-7 md:p-10">
            <div class="mb-8 flex items-start justify-between gap-6"><h2 id="favorites-title" class="text-3xl font-bold tracking-[-.06em]">Favorite outfits</h2><button type="button" data-close-favorites class="text-xl text-[#9b92a0] hover:text-[#201b35]" aria-label="Close favorites"><i class="fa-solid fa-xmark"></i></button></div>
            <div id="favorites-list" class="grid grid-cols-1 gap-5 sm:grid-cols-2"></div>
            <p id="favorites-empty" class="hidden py-10 text-center text-sm text-[#9b92a0]">No saved outfits yet.</p>
        </section>
    </div>
    <div id="item-inspector-modal" class="fixed inset-0 z-[70] hidden items-center justify-center p-5" role="dialog" aria-modal="true" aria-labelledby="item-inspector-title">
        <div class="absolute inset-0 backdrop-blur-sm" style="background: var(--backdrop)" data-close-item-inspector></div>
        <section class="relative max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-[25px] border p-7 md:p-10">
            <div class="mb-8 flex items-start justify-between gap-6"><h2 id="item-inspector-title" class="text-3xl font-bold tracking-[-.06em]"></h2><button type="button" data-close-item-inspector class="text-xl text-[#9b92a0] hover:text-[#201b35]" aria-label="Close item details"><i class="fa-solid fa-xmark"></i></button></div>
            <div id="item-inspector-list" class="space-y-3"></div>
        </section>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
