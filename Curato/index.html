<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curato | Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #04050a;
            --bg-2: #07080d;
            --panel: rgba(255,255,255,0.03);
            --glass-stroke: rgba(255,255,255,0.05);
            --text: rgba(255,255,255,0.96);
            --muted: rgba(255,255,255,0.45);
            --neon: #7cffef; /* cyan-neon */
            --accent: #b0ff6a; /* lime */
            --accent-soft: rgba(176,255,106,0.06);
            --glass-grad: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.008));
        }

        /* Page background */
        body {
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background: radial-gradient(800px 400px at 10% 10%, rgba(124,255,239,0.04), transparent), linear-gradient(180deg,var(--bg-1), var(--bg-2));
            color: var(--text);
            -webkit-font-smoothing:antialiased;
            letter-spacing: -0.01em;
            min-height: 100vh;
            transition: background .6s ease;
        }

        /* subtle static/noise */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.02;
            pointer-events: none;
            z-index: 1;
        }

        /* Glass panels */
        .glass {
            background: var(--glass-grad);
            border: 1px solid var(--glass-stroke);
            border-radius: 16px;
            backdrop-filter: blur(10px) saturate(120%);
            box-shadow: 0 12px 40px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
        }

        /* Nav */
        .nav-blur {
            background: linear-gradient(90deg, rgba(6,8,12,0.6), rgba(6,8,12,0.35));
            border-bottom: 1px solid rgba(255,255,255,0.02);
            backdrop-filter: blur(8px) saturate(120%);
        }
        nav .brand {
            font-weight:700; letter-spacing: -0.04em; font-size:18px;
        }
        nav .subtle {
            font-size:10px; letter-spacing:0.28em; color:var(--muted);
        }

        /* Controls */
        .chip {
            border: 1px solid rgba(255,255,255,0.04);
            padding: 8px 14px; border-radius: 999px; font-size:11px; text-transform:uppercase;
            color:var(--muted); background: linear-gradient(180deg, rgba(255,255,255,0.006), transparent);
            transition: transform .15s ease, box-shadow .15s ease, color .15s;
        }
        .chip:hover { transform: translateY(-4px); color: white; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .chip.active, .cat-opt.active, .sort-opt.active { border-color: var(--neon); color: white; background: var(--accent-soft); }

        /* Header input */
        #occasion-input { font-size:28px; font-weight:300; padding:18px 14px; border-radius:14px; background: transparent; border: 1px solid rgba(255,255,255,0.03); color:var(--text); }
        #occasion-input:focus { box-shadow: 0 8px 30px rgba(124,255,239,0.06); border-color: rgba(124,255,239,0.12); }

        /* Buttons */
        .primary-btn { background: linear-gradient(90deg, rgba(124,255,239,0.95), rgba(176,255,106,0.95)); color: #041012; padding:12px 28px; border-radius:999px; font-weight:700; letter-spacing:0.08em; box-shadow: 0 8px 30px rgba(124,255,239,0.08); border: none; }
        .primary-btn:active { transform: translateY(1px); }
        .subtle-btn { background: rgba(255,255,255,0.02); color:var(--muted); padding:8px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.03); }

        /* Cards and grid */
        .item-card { transition: transform .28s cubic-bezier(.2,.9,.3,1), box-shadow .28s; border-radius:14px; overflow:visible; }
        .item-card .img-container { border-radius:12px; overflow:hidden; box-shadow: 0 8px 30px rgba(2,6,23,0.6); }
        .item-card:hover { transform: translateY(-10px); }
        #catalog-grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:28px; }
        @media(min-width:1024px) { #catalog-grid { grid-template-columns: repeat(3,minmax(0,1fr)); } }

        .item-card p { margin:0; }
        .item-card .title { font-size:13px; font-weight:600; letter-spacing:0.02em; color:var(--text); }
        .item-card .meta { font-size:11px; color:var(--muted); margin-top:6px; }

        /* Image effects */
        .img-container img { width:100%; height:100%; object-fit:cover; transform-origin:center; transition: transform .6s ease, filter .6s ease; filter: saturate(0.85) contrast(1); }
        .item-card:hover .img-container img { transform: scale(1.06) rotate(-0.2deg); filter: saturate(1.05) contrast(1.02); }

        /* Item overlay actions */
        .item-overlay { position:absolute; inset:12px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
        .item-actions { pointer-events:auto; display:flex; gap:8px; }
        .action-btn { backdrop-filter: blur(6px); background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.28)); color:white; padding:8px 10px; border-radius:10px; font-size:12px; border:1px solid rgba(255,255,255,0.025); cursor:pointer; }
        .action-btn.heart { background: linear-gradient(90deg, rgba(124,255,239,0.12), rgba(176,255,106,0.06)); color: var(--neon); }

        /* AI suggestion panel */
        .ai-render-area { color:var(--text); }
        .ai-render-area h2 { font-size:22px; color:var(--neon); font-weight:400; }
        .ai-render-area p, .ai-render-area li { color: rgba(255,255,255,0.88); }
        .ai-render-area blockquote { border-left:3px solid rgba(124,255,239,0.18); background: rgba(124,255,239,0.02); padding:10px 12px; border-radius:8px; }

        /* Chat area */
        #ai-chat { background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent); padding:12px; border-radius:12px; }
        #ai-chat-messages { max-height: 360px; overflow:auto; padding:8px; }
        .bubble { border-radius:12px; padding:12px 14px; }
        .bubble.user { background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(240,240,240,0.95)); color:#041012; }
        .bubble.assistant { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.02); color:var(--text); }

        /* Small screens adjustments */
        @media(max-width:768px) {
            #occasion-input { font-size:20px; padding:14px; }
            .primary-btn { padding:10px 18px; }
            #catalog-grid { gap:18px; }
        }
    </style>
</head>
<body>
<nav class="fixed top-0 w-full z-50 nav-blur">
    <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
        <div class="leading-tight">
            <div class="text-lg font-semibold tracking-tighter uppercase">Curato</div>
            <div class="text-[9px] tracking-[0.4em] text-white/30 uppercase">Personal Archive</div>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center gap-4">
                <select id="model-select" class="bg-transparent border-b border-white/10 text-[9px] uppercase tracking-widest pb-1 focus:outline-none transition-all cursor-pointer text-white/50">
                    <option value="gemini-3.1-flash-lite-preview">3.1 Flash Lite</option>
                    <option value="gemini-3.1-pro-preview">3.1 Pro</option>
                    <option value="gemini-3-flash-preview">3 Flash Preview</option>
                </select>

                <select id="ai-tone-select" class="bg-transparent border-b border-white/10 text-[9px] uppercase tracking-widest pb-1 focus:outline-none transition-all cursor-pointer text-white/50">
                    <option value="Refined">Refined</option>
                    <option value="Casual">Casual</option>
                    <option value="Minimal">Minimal</option>
                    <option value="Playful">Playful</option>
                    <option value="Technical">Technical</option>
                </select>

                <select id="ai-length-select" class="bg-transparent border-b border-white/10 text-[9px] uppercase tracking-widest pb-1 focus:outline-none transition-all cursor-pointer text-white/50">
                    <option value="Concise">Concise</option>
                    <option value="Balanced">Balanced</option>
                    <option value="Verbose">Verbose</option>
                </select>

                <div class="flex items-center gap-2">
                    <input id="ai-creativity" type="range" min="0" max="1" step="0.1" value="0.2" class="w-24" />
                    <span id="ai-creativity-value" class="text-[10px] text-white/40">0.2</span>
                </div>

                <input id="user-api-key" type="password" placeholder="Gemini Key" class="bg-transparent border-b border-white/10 text-[10px] w-32 pb-1 focus:outline-none transition-all" />
            </div>

            <div class="hidden md:flex items-center gap-3">
                <label class="text-[10px] text-white/40 flex items-center gap-2"><input id="ai-allow-external" type="checkbox" /> <span>Allow outside suggestions</span></label>
                <button id="auth-btn" class="text-[10px] tracking-[0.2em] uppercase text-white/50 hover:text-white transition">Connect</button>
            </div>
        </div>
    </div>
</nav>
<main class="max-w-7xl mx-auto px-6 pt-32 pb-24">
    <section class="max-w-4xl mx-auto text-center mb-32">
        <div class="text-[10px] tracking-[0.4em] uppercase text-white/30 mb-8">AI Style Consultant</div>
        <input id="occasion-input" class="w-full bg-transparent border-b border-white/5 py-8 text-center focus:outline-none transition-all" placeholder="Where are we going?" />
        <div class="flex flex-wrap justify-center gap-2 mt-8">
            <button onclick="document.getElementById('occasion-input').value = this.innerText" class="chip">Tokyo solo trip</button>
            <button onclick="document.getElementById('occasion-input').value = this.innerText" class="chip">Meeting the family, 30°C</button>
            <button onclick="document.getElementById('occasion-input').value = this.innerText" class="chip">Late night in Soho</button>
        </div>
        <div class="mt-12">
            <div class="flex justify-center">
                <button id="ask-btn" class="primary-btn">Consult Archive</button>
            </div>

            <div id="ai-chat" class="hidden mt-8 max-w-2xl mx-auto">
                <div id="ai-suggestion" class="glass p-6 rounded-2xl ai-render-area mb-6"></div>

                <div id="ai-chat-messages" class="glass p-4 rounded-2xl mb-4"></div>

                <div class="flex gap-3 items-center">
                    <input id="ai-followup-input" placeholder="Ask a follow-up question..." class="w-full bg-transparent border-b border-white/5 py-3 text-sm focus:outline-none" />
                    <button id="ai-followup-send" class="subtle-btn">Send</button>
                </div>
            </div>
        </div>
    </section>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-16">
        <div class="lg:col-span-4 lg:sticky lg:top-28 h-fit">
            <div class="glass p-8 rounded-[2rem]">
                <div class="text-[10px] tracking-[0.3em] uppercase text-white/30 mb-8">New Addition</div>
                <div id="drop-zone" class="aspect-square border border-white/5 rounded-2xl flex items-center justify-center cursor-pointer relative overflow-hidden group hover:border-white/20 transition-all bg-white/[0.02]">
                    <div class="text-center group-hover:scale-110 transition-transform duration-500">
                        <div class="text-2xl font-light text-white/20">+</div>
                        <div id="drop-text" class="text-[9px] tracking-[0.3em] uppercase mt-2 text-white/30">Upload Image</div>
                    </div>
                    <img id="preview-img" class="absolute inset-0 w-full h-full object-cover hidden" />
                    <input id="file-input" type="file" class="hidden" accept="image/*" />
                </div>
                <div id="category-wrap" class="mt-8">
                    <div class="flex flex-wrap gap-2 justify-center md:justify-start p-2 rounded-2xl border border-white/5 bg-white/[0.02] backdrop-blur-sm">
                        <button class="chip sort-opt active" data-sort="ALL">All</button>
                        <button class="chip sort-opt" data-sort="TOPS">Tops</button>
                        <button class="chip sort-opt" data-sort="BOTTOMS">Bottoms</button>
                        <button class="chip sort-opt" data-sort="Watch">Watches</button>
                        <button class="chip sort-opt" data-sort="Fragrance">Scent</button>
                        <button class="chip sort-opt" data-sort="Shoes">Shoes</button>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <button class="chip cat-opt" data-val="Watch">Watch</button>
                        <button class="chip cat-opt" data-val="Fragrance">Scent</button>
                        <button class="chip cat-opt" data-val="Shoes">Shoes</button>
                        <button class="chip cat-opt" data-val="Other" data-sub="Top">Top</button>
                        <button class="chip cat-opt" data-val="Other" data-sub="Bottom">Bottom</button>
                    </div>
                </div>
                <div class="space-y-4 mt-8">
                    <input id="item-name" placeholder="Item Name" class="w-full bg-transparent border-b border-white/5 py-3 text-sm focus:outline-none" />
                    <input id="item-brand" placeholder="Brand / Designer" class="w-full bg-transparent border-b border-white/5 py-3 text-sm focus:outline-none" />
                </div>
                <button id="save-btn" class="w-full mt-10 bg-white text-black text-[10px] tracking-[0.3em] uppercase py-5 rounded-2xl hover:bg-[#efefef] transition-colors font-medium">
                    Archive Item
                </button>
            </div>
        </div>
        <div class="lg:col-span-8">
            <div class="flex justify-between items-end mb-12">
                <div class="text-[10px] tracking-[0.3em] uppercase text-white/30">The Collection</div>
                <div id="item-count" class="text-[10px] tracking-[0.1em] text-white/20 tabular-nums">00 ITEMS</div>
            </div>
            <div id="catalog-grid" class="grid grid-cols-2 md:grid-cols-3 gap-x-8 gap-y-12"></div>
        </div>
    </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
