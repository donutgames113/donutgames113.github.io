<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curato | Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(180deg,#0b0b0c 0%, #0f0f12 100%);
            --card: rgba(255,255,255,0.03);
            --stroke: rgba(255,255,255,0.06);
            --text: rgba(255,255,255,0.95);
            --muted: rgba(255,255,255,0.45);
            --accent: #d4ff6a;
            --accent-2: rgba(212,255,106,0.08);
        }
        body {
            font-family: Inter, sans-serif;
            background: var(--bg);
            color: var(--text);
            letter-spacing: -0.02em;
            min-height: 100vh;
            -webkit-font-smoothing:antialiased;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.03;
            pointer-events: none;
            z-index: 50;
        }
        .glass {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border: 1px solid var(--stroke);
            backdrop-filter: blur(16px) saturate(120%);
            box-shadow: 0 8px 30px rgba(2,4,8,0.6);
        }
        .nav-blur {
            background: rgba(6,7,9,0.65);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .item-card { transition: all .35s cubic-bezier(.2,.8,.2,1); position: relative; }
        .item-card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(2,4,8,0.6); }
        .img-container { aspect-ratio: 4/5; overflow: hidden; border-radius: 14px; border: 1px solid rgba(255,255,255,0.03); background: linear-gradient(180deg,#0e0e10,#0b0b0c); }
        .item-card img { filter: saturate(0.75) brightness(0.95); transition: .6s ease; width:100%; height:100%; object-fit:cover; }
        .item-card:hover img { filter: saturate(1) brightness(1); transform: scale(1.04); }
        .chip { border: 1px solid rgba(255,255,255,0.04); padding: 7px 16px; border-radius: 999px; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); transition:.18s; cursor:pointer; background:transparent; }
        .chip:hover, .cat-opt.active, .sort-opt.active { border-color: var(--accent); color:white; background: var(--accent-2); }
        #occasion-input { font-size:28px; font-weight:200; padding:12px 8px; border-radius:10px; }
        .primary-btn { background: linear-gradient(90deg,#ffffff,#f7f7f7); color:black; padding:12px 28px; border-radius:999px; font-weight:600; letter-spacing:0.12em; }
        .subtle-btn { background:transparent; color:var(--muted); padding:8px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.03); }
        input::placeholder { color: rgba(255,255,255,0.2); }
        input:focus { outline: none; box-shadow: 0 0 0 4px rgba(212,255,106,0.04); border-color: var(--accent) !important; }
        select option { background: #0f0f12; color: white; }

        /* AI / Chat */
        .ai-render-area { text-align:left; line-height:1.8; }
        .ai-render-area h2 { font-size:24px; font-weight:300; color:var(--accent); margin-bottom:1rem; }
        .ai-render-area h3 { font-size:11px; font-weight:700; color:white; text-transform:uppercase; letter-spacing:0.18em; margin-top:1rem; border-bottom:1px solid rgba(255,255,255,0.04); padding-bottom:0.35rem; }
        .ai-render-area ul { margin-top:0.75rem; list-style:none; padding-left:0; }
        .ai-render-area li { margin-bottom:1rem; font-size:14px; color:rgba(255,255,255,0.8); }
        .ai-render-area li strong { display:block; color:white; font-size:15px; margin-bottom:3px; }
        .ai-render-area blockquote { margin-top:1rem; padding:1rem; background: rgba(255,255,255,0.01); border-left:3px solid var(--accent); font-size:13px; color:var(--muted); font-style:italic; }

        /* Chat bubbles */
        #ai-chat-messages { max-height: 360px; overflow:auto; padding:12px; }
        .chat-row { display:flex; gap:12px; align-items:flex-start; }
        .chat-row.user { justify-content:flex-end; }
        .bubble { max-width:78%; padding:12px 14px; border-radius:12px; font-size:14px; line-height:1.5; }
        .bubble.user { background: rgba(255,255,255,0.95); color:#0b0b0c; border-bottom-right-radius:6px; }
        .bubble.assistant { background: rgba(255,255,255,0.03); color:var(--text); border-bottom-left-radius:6px; border:1px solid rgba(255,255,255,0.02); }

    </style>
</head>
<body>
<nav class="fixed top-0 w-full z-50 nav-blur">
    <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
        <div class="leading-tight">
            <div class="text-lg font-semibold tracking-tighter uppercase">Curato</div>
            <div class="text-[9px] tracking-[0.4em] text-white/30 uppercase">Personal Archive</div>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center gap-4">
                <select id="model-select" class="bg-transparent border-b border-white/10 text-[9px] uppercase tracking-widest pb-1 focus:outline-none transition-all cursor-pointer text-white/50">
                    <option value="gemini-3.1-flash-lite-preview">3.1 Flash Lite</option>
                    <option value="gemini-3.1-pro-preview">3.1 Pro</option>
                    <option value="gemini-3-flash-preview">3 Flash Preview</option>
                </select>

                <select id="ai-tone-select" class="bg-transparent border-b border-white/10 text-[9px] uppercase tracking-widest pb-1 focus:outline-none transition-all cursor-pointer text-white/50">
                    <option value="Refined">Refined</option>
                    <option value="Casual">Casual</option>
                    <option value="Minimal">Minimal</option>
                    <option value="Playful">Playful</option>
                    <option value="Technical">Technical</option>
                </select>

                <select id="ai-length-select" class="bg-transparent border-b border-white/10 text-[9px] uppercase tracking-widest pb-1 focus:outline-none transition-all cursor-pointer text-white/50">
                    <option value="Concise">Concise</option>
                    <option value="Balanced">Balanced</option>
                    <option value="Verbose">Verbose</option>
                </select>

                <div class="flex items-center gap-2">
                    <input id="ai-creativity" type="range" min="0" max="1" step="0.1" value="0.2" class="w-24" />
                    <span id="ai-creativity-value" class="text-[10px] text-white/40">0.2</span>
                </div>

                <input id="user-api-key" type="password" placeholder="Gemini Key" class="bg-transparent border-b border-white/10 text-[10px] w-32 pb-1 focus:outline-none transition-all" />
            </div>

            <div class="hidden md:flex items-center gap-3">
                <label class="text-[10px] text-white/40 flex items-center gap-2"><input id="ai-allow-external" type="checkbox" /> <span>Allow outside suggestions</span></label>
                <button id="auth-btn" class="text-[10px] tracking-[0.2em] uppercase text-white/50 hover:text-white transition">Connect</button>
            </div>
        </div>
    </div>
</nav>
<main class="max-w-7xl mx-auto px-6 pt-32 pb-24">
    <section class="max-w-4xl mx-auto text-center mb-32">
        <div class="text-[10px] tracking-[0.4em] uppercase text-white/30 mb-8">AI Style Consultant</div>
        <input id="occasion-input" class="w-full bg-transparent border-b border-white/5 py-8 text-center focus:outline-none transition-all" placeholder="Where are we going?" />
        <div class="flex flex-wrap justify-center gap-2 mt-8">
            <button onclick="document.getElementById('occasion-input').value = this.innerText" class="chip">Tokyo solo trip</button>
            <button onclick="document.getElementById('occasion-input').value = this.innerText" class="chip">Meeting the family, 30°C</button>
            <button onclick="document.getElementById('occasion-input').value = this.innerText" class="chip">Late night in Soho</button>
        </div>
        <div class="mt-12">
            <div class="flex justify-center">
                <button id="ask-btn" class="primary-btn">Consult Archive</button>
            </div>

            <div id="ai-chat" class="hidden mt-8 max-w-2xl mx-auto">
                <div id="ai-suggestion" class="glass p-6 rounded-2xl ai-render-area mb-6"></div>

                <div id="ai-chat-messages" class="glass p-4 rounded-2xl mb-4"></div>

                <div class="flex gap-3 items-center">
                    <input id="ai-followup-input" placeholder="Ask a follow-up question..." class="w-full bg-transparent border-b border-white/5 py-3 text-sm focus:outline-none" />
                    <button id="ai-followup-send" class="subtle-btn">Send</button>
                </div>
            </div>
        </div>
    </section>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-16">
        <div class="lg:col-span-4 lg:sticky lg:top-28 h-fit">
            <div class="glass p-8 rounded-[2rem]">
                <div class="text-[10px] tracking-[0.3em] uppercase text-white/30 mb-8">New Addition</div>
                <div id="drop-zone" class="aspect-square border border-white/5 rounded-2xl flex items-center justify-center cursor-pointer relative overflow-hidden group hover:border-white/20 transition-all bg-white/[0.02]">
                    <div class="text-center group-hover:scale-110 transition-transform duration-500">
                        <div class="text-2xl font-light text-white/20">+</div>
                        <div id="drop-text" class="text-[9px] tracking-[0.3em] uppercase mt-2 text-white/30">Upload Image</div>
                    </div>
                    <img id="preview-img" class="absolute inset-0 w-full h-full object-cover hidden" />
                    <input id="file-input" type="file" class="hidden" accept="image/*" />
                </div>
                <div id="category-wrap" class="mt-8">
                    <div class="flex flex-wrap gap-2 justify-center md:justify-start p-2 rounded-2xl border border-white/5 bg-white/[0.02] backdrop-blur-sm">
                        <button class="chip sort-opt active" data-sort="ALL">All</button>
                        <button class="chip sort-opt" data-sort="TOPS">Tops</button>
                        <button class="chip sort-opt" data-sort="BOTTOMS">Bottoms</button>
                        <button class="chip sort-opt" data-sort="Watch">Watches</button>
                        <button class="chip sort-opt" data-sort="Fragrance">Scent</button>
                        <button class="chip sort-opt" data-sort="Shoes">Shoes</button>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <button class="chip cat-opt" data-val="Watch">Watch</button>
                        <button class="chip cat-opt" data-val="Fragrance">Scent</button>
                        <button class="chip cat-opt" data-val="Shoes">Shoes</button>
                        <button class="chip cat-opt" data-val="Other" data-sub="Top">Top</button>
                        <button class="chip cat-opt" data-val="Other" data-sub="Bottom">Bottom</button>
                    </div>
                </div>
                <div class="space-y-4 mt-8">
                    <input id="item-name" placeholder="Item Name" class="w-full bg-transparent border-b border-white/5 py-3 text-sm focus:outline-none" />
                    <input id="item-brand" placeholder="Brand / Designer" class="w-full bg-transparent border-b border-white/5 py-3 text-sm focus:outline-none" />
                </div>
                <button id="save-btn" class="w-full mt-10 bg-white text-black text-[10px] tracking-[0.3em] uppercase py-5 rounded-2xl hover:bg-[#efefef] transition-colors font-medium">
                    Archive Item
                </button>
            </div>
        </div>
        <div class="lg:col-span-8">
            <div class="flex justify-between items-end mb-12">
                <div class="text-[10px] tracking-[0.3em] uppercase text-white/30">The Collection</div>
                <div id="item-count" class="text-[10px] tracking-[0.1em] text-white/20 tabular-nums">00 ITEMS</div>
            </div>
            <div id="catalog-grid" class="grid grid-cols-2 md:grid-cols-3 gap-x-8 gap-y-12"></div>
        </div>
    </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
